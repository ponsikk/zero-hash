name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-rust:
    name: Build Rust Library
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-action@stable
    
    - name: Build
      working-directory: rust-ffi
      run: cargo build --release
    
    - name: Run Rust tests
      working-directory: rust-ffi
      run: cargo test --release
    
    - name: Upload native library
      uses: actions/upload-artifact@v4
      with:
        name: native-${{ matrix.os }}
        path: |
          rust-ffi/target/release/*.dll
          rust-ffi/target/release/*.so
          rust-ffi/target/release/*.dylib
        if-no-files-found: ignore

  build-java:
    name: Build and Test Java
    runs-on: ubuntu-latest
    needs: build-rust
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Java 25
      uses: actions/setup-java@v4
      with:
        java-version: '25-ea'
        distribution: 'temurin'
    
    - name: Install Rust
      uses: dtolnay/rust-action@stable
    
    - name: Build native library
      working-directory: rust-ffi
      run: cargo build --release
    
    - name: Build with Maven
      run: mvn compile -B
    
    - name: Run tests
      run: mvn test -B
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/rust-ffi/target/release
    
    - name: Run benchmark (optional)
      run: |
        java --enable-preview --enable-native-access=ALL-UNNAMED \
          -Djava.library.path=rust-ffi/target/release \
          -cp target/classes \
          io.zerohash.benchmark.SimpleBenchmark || true
      continue-on-error: true

  release:
    name: Create Release Artifacts
    runs-on: ubuntu-latest
    needs: [build-rust, build-java]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: native-libs
    
    - name: Package native libraries
      run: |
        mkdir -p dist/native
        find native-libs -type f \( -name "*.dll" -o -name "*.so" -o -name "*.dylib" \) -exec cp {} dist/native/ \;
        ls -la dist/native/
