name: Build and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build, Test & Benchmark
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Set up Java 25
      uses: actions/setup-java@v4
      with:
        java-version: '25-ea'
        distribution: 'temurin'
    
    - name: Build Rust library
      working-directory: rust-ffi
      run: cargo build --release
    
    - name: Run Rust tests
      working-directory: rust-ffi
      run: cargo test --release
    
    - name: Build Java
      run: mvn compile -B
    
    - name: Run Java tests
      run: mvn test -B
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/rust-ffi/target/release
    
    - name: Run benchmark
      run: |
        java --enable-preview --enable-native-access=ALL-UNNAMED \
          -Djava.library.path=rust-ffi/target/release \
          -cp target/classes \
          io.zerohash.benchmark.SimpleBenchmark
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/rust-ffi/target/release
    
    - name: Compile test classes for JMH
      run: mvn test-compile -B
    
    - name: Run JMH Benchmarks
      run: |
        java --enable-preview --enable-native-access=ALL-UNNAMED \
          -Djava.library.path=rust-ffi/target/release \
          -cp "target/test-classes:target/classes:$HOME/.m2/repository/org/openjdk/jmh/jmh-core/1.37/jmh-core-1.37.jar:$HOME/.m2/repository/org/openjdk/jmh/jmh-generator-annprocess/1.37/jmh-generator-annprocess-1.37.jar:$HOME/.m2/repository/net/sf/jopt-simple/jopt-simple/5.0.4/jopt-simple-5.0.4.jar:$HOME/.m2/repository/org/apache/commons/commons-math3/3.6.1/commons-math3-3.6.1.jar" \
          org.openjdk.jmh.Main ".*Blake3.*" -f 1 -wi 2 -i 3 -t 1
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/rust-ffi/target/release
